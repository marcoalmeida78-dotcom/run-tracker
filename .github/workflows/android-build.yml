name: Android Cloud Build

on:
  workflow_dispatch: # Permite que você clique em um botão no GitHub para iniciar o build manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar o Java (Necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Gerar arquivos nativos do Android (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Compilar APK (Modo Debug ou Release)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Salvar o APK gerado como anexo
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
