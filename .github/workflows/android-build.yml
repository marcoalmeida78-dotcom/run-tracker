name: Build Android Standalone APK

on:
  push:
    branches:
      - main # ou 'master', dependendo do nome da tua branch principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Gerar pasta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Gerar APK Autónomo (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Guardar Ficheiro APK como Artefacto no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RunTracker-Standalone
          path: android/app/build/outputs/apk/release/app-release.apk
